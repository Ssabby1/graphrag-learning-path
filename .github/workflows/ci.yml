name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRAPH_BACKEND: csv
      GRAPH_CONCEPTS_CSV: ${{ github.workspace }}/data/seed/concepts.csv
      GRAPH_RELATIONS_CSV: ${{ github.workspace }}/data/seed/relations.csv
      EMBEDDING_BACKEND: unicode_hashing
      RERANKER_ENABLED: "false"
      LLM_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Regenerate Stage 6 reports
        run: python evals/stage6_report.py

      - name: Validate report artifacts
        run: >-
          python -c "import json, pathlib;
          root = pathlib.Path('evals/reports');
          files = [root / 'stage6_summary.json',
          *(root / 'stage6_modules' / f'{name}.json' for name in
          ('target_resolver', 'path_planner', 'evidence_retriever', 'answer_generator'))];
          [json.loads(path.read_text(encoding='utf-8')) for path in files];
          assert all(path.with_suffix('.md').is_file() for path in files)"

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  portability:
    name: Cross-platform entrypoint checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Unix entrypoints
        run: bash -n setup.sh start-dev.sh stop-dev.sh

      - name: Verify Windows entrypoints are versioned
        shell: pwsh
        run: |
          $required = @('setup.ps1', 'start-dev.ps1', 'stop-dev.ps1')
          $missing = $required | Where-Object { -not (Test-Path $_ -PathType Leaf) }
          if ($missing) { throw "Missing Windows entrypoints: $($missing -join ', ')" }
