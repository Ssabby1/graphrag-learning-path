name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRAPH_BACKEND: csv
      GRAPH_CONCEPTS_CSV: ${{ github.workspace }}/data/seed/concepts.csv
      GRAPH_RELATIONS_CSV: ${{ github.workspace }}/data/seed/relations.csv
      EMBEDDING_BACKEND: unicode_hashing
      RERANKER_ENABLED: "false"
      LLM_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Regenerate correctness and Stage 6 reports
        run: |
          python evals/graphrag_contract_runner.py
          python evals/stage5_answer_runner.py
          python evals/stage6_report.py

      - name: Validate report artifacts
        run: >-
          python -c "import json, pathlib;
          root = pathlib.Path('evals/reports');
          files = [root / 'graphrag_contract.json', root / 'stage6_summary.json',
          *(root / 'stage6_modules' / f'{name}.json' for name in
          ('target_resolver', 'path_planner', 'evidence_retriever', 'answer_generator'))];
          [json.loads(path.read_text(encoding='utf-8')) for path in files];
          assert all(path.with_suffix('.md').is_file() for path in files)"

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  portability:
    name: Unix entrypoint checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Unix entrypoints
        run: bash -n setup.sh start-dev.sh stop-dev.sh


  windows-smoke:
    name: Windows CSV setup and smoke test
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      EMBEDDING_BACKEND: unicode_hashing
      LLM_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run clean-clone setup
        shell: pwsh
        run: .\setup.ps1

      - name: Start and exercise the public sample
        shell: pwsh
        run: |
          try {
            .\start-dev.ps1
            $deadline = (Get-Date).AddSeconds(60)
            do {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 2
              } catch {
                Start-Sleep -Seconds 1
              }
            } until ($health.status -eq 'ok' -or (Get-Date) -gt $deadline)
            if ($health.status -ne 'ok') { throw 'Backend did not become healthy within 60 seconds.' }

            $body = @{
              question = 'What should I learn before studying Karnaugh maps?'
              target_concept_id = 'c_006'
              mastered_concepts = @()
              response_language = 'en'
            } | ConvertTo-Json
            $result = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8000/graphrag/query' -ContentType 'application/json' -Body $body
            if ($result.status -ne 'ok') { throw "Unexpected GraphRAG status: $($result.status)" }
            if ($result.meta.path_edge_evidence_coverage -ne 1) { throw 'Path evidence coverage is incomplete.' }

            $frontend = $null
            $frontendDeadline = (Get-Date).AddSeconds(30)
            do {
              try {
                $frontend = Invoke-WebRequest -Uri 'http://127.0.0.1:5173' -TimeoutSec 2
              } catch {
                Start-Sleep -Seconds 1
              }
            } until ($frontend.StatusCode -eq 200 -or (Get-Date) -gt $frontendDeadline)
            if ($frontend.StatusCode -ne 200) { throw 'Frontend did not become ready within 30 seconds.' }
          } finally {
            .\stop-dev.ps1
          }
